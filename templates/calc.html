<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
</head>
<body>

    <form method="POST">
        {% csrf_token %}

        <h3>Enter 1st Number</h3>
        <input type="number" name="x" required>

        <h3>Enter 2nd Number</h3>
        <input type="number" name="y" required><br>

        <h3>Enter operator</h3>
        <input type="text" name="op" required><br><br>

        <input type="submit" value="Calculate">
    </form>

    {% if result is not None %}
        <h2>Result: {{ result }}</h2>
    {% endif %}

</body>
</html>
